  #   networks:
  #     - eapi-net

  kong:
    image: docker.io/kong:latest
    container_name: kong
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    environment:
      # Use Consul for DNS resolution
      KONG_DNS_RESOLVER: "consul-server:8600"
      KONG_DATABASE: "off" # We will use declarative config
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
    networks:
      - eapi-net
    depends_on:
      consul-server:
        condition: service_healthy
    volumes:
      - ./kong:/usr/local/kong/declarative

volumes:
  consul_data:
    driver: local

networks:
  eapi-net:
    driver: bridge