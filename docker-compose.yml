  backend:
    build: be
    ports:
      - "${BACKEND_ENTRY_PORT}:${BACKEND_ENTRY_PORT}"
    volumes:
      - ./be:/app
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST}
      FRONTEND_PORT: ${FRONTEND_PORT}
      THIS_HOST: ${BACKEND_ENTRY_HOST}
      THIS_PORT: ${BACKEND_ENTRY_PORT}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    networks:
      - eapi-net

  frontend:
    build:
      context: fe
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./fe:/app
    environment:
      VITE_API_HOST: ${BACKEND_ENTRY_HOST}
      VITE_API_PORT: ${BACKEND_ENTRY_PORT}
    networks:
      - eapi-net

volumes:
  consul_data:
    driver: local

networks:
  eapi-net:
    driver: bridge